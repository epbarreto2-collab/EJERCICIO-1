<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promedio de Notas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Calculadora de Promedio de Notas</h1>

    <form id="notasForm">
        <label for="nota1">Nota 1 (0 a 10):</label>
        <input type="number" id="nota1" min="0" max="10" step="0.01" required><br><br>

        <label for="nota2">Nota 2 (0 a 10):</label>
        <input type="number" id="nota2" min="0" max="10" step="0.01" required><br><br>

        <label for="nota3">Nota 3 (0 a 10):</label>
        <input type="number" id="nota3" min="0" max="10" step="0.01" required><br><br>

        <button type="submit">Calcular Promedio</button>
    </form>

    <div id="resultado" style="margin-top: 20px;"></div>

    <script src="app.js"></script>
</body>
</html>
