<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>División de Cuenta y Propina</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>División de la Cuenta del Restaurante</h1>

    <form id="cuentaForm">
        <label for="totalCuenta">Total de la cuenta ($):</label>
        <input type="number" id="totalCuenta" min="0.01" step="0.01" placeholder="Ej. 45.50" required><br><br>

        <label for="porcentajePropina">Porcentaje de propina (%):</label>
        <input type="number" id="porcentajePropina" min="0" step="1" placeholder="Ej. 10" required><br><br>

        <label for="numeroPersonas">Número de personas:</label>
        <input type="number" id="numeroPersonas" min="1" step="1" placeholder="Ej. 3" required><br><br>

        <button type="submit">Calcular División</button>
    </form>

    <div id="resultado" style="margin-top: 20px;"></div>

    <script src="app.js"></script>
</body>
</html>
